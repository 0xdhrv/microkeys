<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="microkeys keycap mascot">
<style>
svg{--k-body:var(--accent,#ff6900);--k-lip:var(--accent-text,#c24f00);--k-eye:#14120f;--k-shadow:var(--text-strong,#14120f)}
@media (prefers-color-scheme:dark){svg{--k-shadow:var(--text-strong,#fff)}}
.a{animation-duration:4.8s;animation-iteration-count:infinite;animation-timing-function:linear}
.walk{animation-name:walk}
.hop{animation-name:hop}
.squash{animation-name:squash;transform-origin:0 0}
.shadowx{animation-name:shadowx;transform-origin:0 0}
.shadow{animation-name:shadowo;fill:var(--k-shadow);opacity:.12}
.look{animation-name:look}
.blink{animation-name:blink;transform-box:fill-box;transform-origin:center}
.lip{fill:var(--k-lip)}.top{fill:var(--k-body)}.eye{fill:var(--k-eye)}
.smile{fill:none;stroke:var(--k-eye);stroke-width:2.4;stroke-linecap:round;animation-name:smile}
.grin{fill:var(--k-eye);opacity:0;animation-name:grin}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
@keyframes walk{0.0%{transform:translateX(0px);animation-timing-function:cubic-bezier(.65,0,.35,1);}12.5%{transform:translateX(0px);animation-timing-function:cubic-bezier(.65,0,.35,1);}23.958%{transform:translateX(14px);}31.25%{transform:translateX(14px);animation-timing-function:cubic-bezier(.65,0,.35,1);}42.708%{transform:translateX(-14px);}50.0%{transform:translateX(-14px);animation-timing-function:cubic-bezier(.65,0,.35,1);}62.5%{transform:translateX(0px);}100.0%{transform:translateX(0px);}}@keyframes hop{0.0%{transform:translateY(0);animation-timing-function:cubic-bezier(.23,1,.32,1);}12.5%{transform:translateY(0);animation-timing-function:cubic-bezier(.23,1,.32,1);}18.229%{transform:translateY(-8px);animation-timing-function:cubic-bezier(.55,0,1,.45);}23.958%{transform:translateY(0);}31.25%{transform:translateY(0);animation-timing-function:cubic-bezier(.23,1,.32,1);}36.979%{transform:translateY(-10px);animation-timing-function:cubic-bezier(.55,0,1,.45);}42.708%{transform:translateY(0);}50.0%{transform:translateY(0);animation-timing-function:cubic-bezier(.23,1,.32,1);}56.25%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.55,0,1,.45);}62.5%{transform:translateY(0);}100.0%{transform:translateY(0);}}@keyframes squash{0.0%{transform:scale(1,1);animation-timing-function:cubic-bezier(.23,1,.32,1);}9.375%{transform:scale(1,1);animation-timing-function:cubic-bezier(.23,1,.32,1);}12.5%{transform:scale(1.07,.92);animation-timing-function:cubic-bezier(.23,1,.32,1);}14.583%{transform:scale(.95,1.07);animation-timing-function:cubic-bezier(.65,0,.35,1);}21.875%{transform:scale(.96,1.05);animation-timing-function:cubic-bezier(.23,1,.32,1);}23.958%{transform:scale(1.1,.88);animation-timing-function:cubic-bezier(.23,1,.32,1);}28.125%{transform:scale(1,1);}28.125%{transform:scale(1,1);animation-timing-function:cubic-bezier(.23,1,.32,1);}31.25%{transform:scale(1.07,.92);animation-timing-function:cubic-bezier(.23,1,.32,1);}33.333%{transform:scale(.95,1.07);animation-timing-function:cubic-bezier(.65,0,.35,1);}40.625%{transform:scale(.96,1.05);animation-timing-function:cubic-bezier(.23,1,.32,1);}42.708%{transform:scale(1.1,.88);animation-timing-function:cubic-bezier(.23,1,.32,1);}46.875%{transform:scale(1,1);}46.875%{transform:scale(1,1);animation-timing-function:cubic-bezier(.23,1,.32,1);}50.0%{transform:scale(1.07,.92);animation-timing-function:cubic-bezier(.23,1,.32,1);}52.083%{transform:scale(.95,1.07);animation-timing-function:cubic-bezier(.65,0,.35,1);}60.417%{transform:scale(.96,1.05);animation-timing-function:cubic-bezier(.23,1,.32,1);}62.5%{transform:scale(1.16,.82);animation-timing-function:cubic-bezier(.23,1,.32,1);}66.667%{transform:scale(1,1);}68.75%{transform:scale(1,1);}100.0%{transform:scale(1,1);}}@keyframes shadowx{0.0%{transform:scaleX(1);animation-timing-function:cubic-bezier(.23,1,.32,1);}12.5%{transform:scaleX(1);animation-timing-function:cubic-bezier(.23,1,.32,1);}18.229%{transform:scaleX(.72);animation-timing-function:cubic-bezier(.55,0,1,.45);}23.958%{transform:scaleX(1);}31.25%{transform:scaleX(1);animation-timing-function:cubic-bezier(.23,1,.32,1);}36.979%{transform:scaleX(.72);animation-timing-function:cubic-bezier(.55,0,1,.45);}42.708%{transform:scaleX(1);}50.0%{transform:scaleX(1);animation-timing-function:cubic-bezier(.23,1,.32,1);}56.25%{transform:scaleX(.72);animation-timing-function:cubic-bezier(.55,0,1,.45);}62.5%{transform:scaleX(1);}100.0%{transform:scaleX(1);}}@keyframes shadowo{0.0%{opacity:0.12;}12.5%{opacity:0.12;}18.229%{opacity:0.07;}23.958%{opacity:0.12;}31.25%{opacity:0.12;}36.979%{opacity:0.07;}42.708%{opacity:0.12;}50.0%{opacity:0.12;}56.25%{opacity:0.07;}62.5%{opacity:0.12;}100.0%{opacity:0.12;}}@keyframes look{0.0%{transform:translateX(0px);animation-timing-function:cubic-bezier(.23,1,.32,1);}10.417%{transform:translateX(0px);animation-timing-function:cubic-bezier(.23,1,.32,1);}12.5%{transform:translateX(2.2px);}29.167%{transform:translateX(0px);animation-timing-function:cubic-bezier(.23,1,.32,1);}31.25%{transform:translateX(-2.2px);}34.375%{transform:translateX(2.2px);animation-timing-function:cubic-bezier(.23,1,.32,1);}38.542%{transform:translateX(0px);}47.917%{transform:translateX(0px);animation-timing-function:cubic-bezier(.23,1,.32,1);}50.0%{transform:translateX(2.2px);}53.125%{transform:translateX(-2.2px);animation-timing-function:cubic-bezier(.23,1,.32,1);}57.292%{transform:translateX(0px);}60.417%{transform:translateX(0px);}100.0%{transform:translateX(0px);}}@keyframes blink{0.0%{transform:scaleY(1);}6.25%{transform:scaleY(1);animation-timing-function:cubic-bezier(.23,1,.32,1);}7.708%{transform:scaleY(.1);animation-timing-function:cubic-bezier(.23,1,.32,1);}9.583%{transform:scaleY(1);}81.25%{transform:scaleY(1);animation-timing-function:cubic-bezier(.23,1,.32,1);}82.708%{transform:scaleY(.1);animation-timing-function:cubic-bezier(.23,1,.32,1);}84.583%{transform:scaleY(1);}100.0%{transform:scaleY(1);}}@keyframes grin{0.0%{opacity:0;}62.5%{opacity:0;}63.333%{opacity:1;}77.083%{opacity:1;}78.75%{opacity:0;}100.0%{opacity:0;}}@keyframes smile{0.0%{opacity:1;}62.5%{opacity:1;}63.333%{opacity:0;}77.083%{opacity:0;}78.75%{opacity:1;}100.0%{opacity:1;}}
</style>
<g transform="translate(48 84)"><g class="a walk">
 <g class="a shadowx"><ellipse class="a shadow" cx="0" cy="1" rx="22" ry="3.5"/></g>
 <g class="a hop"><g class="a squash">
  <rect class="lip" x="-24" y="-38" width="48" height="34" rx="11"/>
  <rect class="top" x="-24" y="-44" width="48" height="34" rx="11"/>
  <g class="a look">
   <g class="a blink"><circle class="eye" cx="-8" cy="-29" r="3.4"/><circle class="eye" cx="8" cy="-29" r="3.4"/></g>
   <path class="a smile" d="M-4.5 -21q4.5 4.5 9 0"/>
   <path class="a grin" d="M-6 -22q6 10 12 0z"/>
  </g>
 </g></g>
</g></g>
</svg>
