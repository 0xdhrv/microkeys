name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - name: Check
        run: pnpm check

      - name: Size
        run: node scripts/size.mjs

      - name: Build site
        run: pnpm site:build
